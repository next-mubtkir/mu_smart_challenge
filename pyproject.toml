[project]
name = "mu_smart_challenge"
authors = [{ name = "MUBTKIR", email = "info@mubtkir.com" }]
description = "WhatsApp business-simulation challenge engine that generates qualified ERPNext Leads."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "mu_smart_challenge"

# Required by Frappe Cloud / Press to validate app compatibility with the
# target bench. Widen or narrow this range to match the bench you install on.
[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<17.0.0"
